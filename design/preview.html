<script>
'use strict';
const $=(s,e=document)=>e.querySelector(s), $$=(s,e=document)=>[...e.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon=(id,cls='')=>`<svg class="ico ${cls}" aria-hidden="true"><use href="#${id}"/></svg>`;
const money=n=>Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const categories=['餐饮','饮品','交通','购物','居家','水电','服务','服饰','娱乐','医疗','学习','通讯','旅行','运动','美容','宠物','育儿','人情','汽车','保险','税费','其他'];
const colors=['#356953','#84a87b','#a9bd92','#c3cba9','#bc916e','#7e9eab'];
const catIcons={'餐饮':'food','饮品':'cup','交通':'train','购物':'bag','居家':'home','水电':'utilities','服务':'service','服饰':'clothing','娱乐':'entertainment','医疗':'health','学习':'education','通讯':'telecom','旅行':'travel','运动':'sport','美容':'beauty','宠物':'pet','育儿':'child','人情':'gift','汽车':'car','保险':'insurance','税费':'tax','其他':'other','工资':'salary'};
// Category symbols reuse the Android vector designs above.
const initialBills=[
{id:1,merchant:'街角咖啡',item:'冰拿铁',category:'饮品',channel:'微信',amount:18,type:'支出',day:18,time:'09:42:18',account:'零钱'},
{id:2,merchant:'一碗食堂',item:'午间套餐',category:'餐饮',channel:'微信',amount:36,type:'支出',day:19,time:'12:18:30',account:'零钱'},
{id:3,merchant:'城市地铁',item:'出行',category:'交通',channel:'支付宝',amount:6,type:'支出',day:20,time:'08:36:04',account:'余额'},
{id:4,merchant:'生活杂货铺',item:'日用品',category:'购物',channel:'支付宝',amount:128,type:'支出',day:21,time:'18:24:16',account:'余额'},
{id:5,merchant:'便民洗护',item:'衣物清洗',category:'服务',channel:'微信',amount:48,type:'支出',day:22,time:'15:06:25',account:'零钱'},
{id:6,merchant:'生活缴费',item:'电费',category:'水电',channel:'银行卡',amount:96,type:'支出',day:23,time:'10:15:40',account:'生活卡'},
{id:7,merchant:'工资收入',item:'月度工资',category:'工资',channel:'银行卡',amount:8000,type:'收入',day:24,time:'09:00:00',account:'生活卡'}];
const instances=[];
function makeDevice(host,page='overview',modal=''){
 const el=document.createElement('section');el.className='device';el.setAttribute('aria-label','JustLedger 演示界面');host.append(el);
 const state={page,channel:'全部',query:'',hidden:false,dark:false,bills:structuredClone(initialBills),modal:'',draft:null,receiptIndex:0,receipts:[1,2],switches:{auto:true,repeat:true,backtap:true,screen:true,ai:true,priority:true,success:true},returnModal:'editor'};
 const app={el,state};instances.push(app);render(app);if(modal)openModal(app,modal);bind(app);return app;
}
function sums(rows){return {expense:rows.filter(x=>x.type==='支出').reduce((s,x)=>s+x.amount,0),income:rows.filter(x=>x.type==='收入').reduce((s,x)=>s+x.amount,0)}}
function setting(label,desc,symbol,action){return `<button class="setting" data-action="${action}"><span class="tile">${icon(symbol)}</span><span><strong>${label}</strong><small>${desc}</small></span>${icon('arrow','tail')}</button>`}
function overview(app){const s=app.state,t=sums(s.bills),show=n=>s.hidden?'••••':money(n);return `<div class="top">JustLedger<span class="demo-label">演示数据</span></div><h2 class="greeting">每一笔，都清楚。</h2><div class="hero"><div class="hero-head"><span>2026 年 10 月 · CNY</span><button class="icon-button" data-action="privacy" aria-label="${s.hidden?'显示':'隐藏'}金额" aria-pressed="${s.hidden}">${icon('eye')}</button></div><div class="label">月支出</div><div class="total">${show(t.expense)}</div><div class="hero-grid"><div><small>月收入</small><b>${show(t.income)}</b></div><div><small>本月结余</small><b>${show(t.income-t.expense)}</b></div></div><button class="hero-link" data-page="bills">查看本月账单${icon('arrow')}</button></div><button class="service-state" data-action="capture"><span class="tile">${icon('check')}</span><span><strong><i class="dot"></i>自动采集已开启</strong><small>识别通知与短信，按渠道规则入账</small></span></button><div class="caption">常用功能</div>${setting('账单','查看、搜索和核对每一笔收支','bill','bills')}${setting('屏幕识别','轻敲背面，补充订单信息','scan','screen')}<p class="quiet">记录留在本机，生活留给自己。</p>`}
function bills(app){const s=app.state,selected=s.bills.filter(b=>s.channel==='全部'||b.channel===s.channel),t=sums(selected),expenses=selected.filter(b=>b.type==='支出'),cats=[...new Set(expenses.map(b=>b.category))].map(c=>({name:c,sum:expenses.filter(b=>b.category===c).reduce((n,b)=>n+b.amount,0)})).sort((a,b)=>b.sum-a.sum);let angle=0;const stops=cats.map((c,i)=>{const start=angle;angle+=c.sum/t.expense*360;return `${colors[i%colors.length]} ${start}deg ${angle}deg`}).join(',');const max=Math.max(1,...expenses.map(b=>b.amount));return `<div class="top">账单<button class="icon-button" data-action="new" aria-label="新增账单">＋</button></div><div class="monthbar"><button data-action="month">2026 年 10 月 ${icon('down')}</button><span style="font-size:10px;color:var(--muted)">CNY</span></div><div class="chips" aria-label="支付渠道">${['全部','微信','支付宝','银行卡'].map(c=>`<button class="chip" data-channel="${c}" aria-pressed="${s.channel===c}">${c}</button>`).join('')}</div><div class="chart-card"><div class="chart-heading"><span>支出分布</span><span>按分类</span></div><div class="donut-layout"><div class="donut" style="${stops?'background:conic-gradient('+stops+')':''}" role="img" aria-label="当前渠道支出 ${money(t.expense)} 元"><div class="donut-center"><small>本月支出</small><strong>${money(t.expense)}</strong></div></div><div class="legend">${cats.map((c,i)=>`<div><i style="background:${colors[i%colors.length]}"></i>${esc(c.name)}<b>${Math.round(c.sum/t.expense*100)}%</b></div>`).join('')}</div></div><div class="bars" aria-label="最近七日支出">${[18,19,20,21,22,23,24].map(d=>{const n=expenses.filter(b=>b.day===d).reduce((sum,b)=>sum+b.amount,0);return `<div class="bar" title="10 月 ${d} 日支出 ${money(n)}"><i style="height:${Math.max(2,n/max*44)}px"></i><small>${d}</small></div>`}).join('')}</div></div><div class="list-head">账单明细<span>${selected.length} 笔</span></div><input class="search" type="search" value="${esc(s.query)}" aria-label="搜索账单" placeholder="搜索商户、商品或分类"><div class="transactions">${billRows(app)}</div>`}
function billRows(app){const s=app.state,rows=s.bills.filter(b=>(s.channel==='全部'||b.channel===s.channel)&&[b.merchant,b.item,b.category].join(' ').includes(s.query)).sort((a,b)=>b.day-a.day);return rows.map(b=>`<button class="transaction" data-bill="${b.id}" aria-label="编辑 ${esc(b.merchant)} ${money(b.amount)} 元"><span class="tile">${icon(catIcons[b.category]||'other')}</span><span><span class="title">${esc(b.merchant)}</span><small>10-${b.day} · ${esc(b.channel)}</small></span><span class="money ${b.type==='收入'?'income':''}">${b.type==='收入'?'+':'−'}${money(b.amount)}</span></button>`).join('')||'<div class="empty">没有找到这笔记录</div>'}
function settings(){return `<div class="top">设置<span class="demo-label">演示数据</span></div>${setting('自动记账','权限与后台运行','bell','capture')}${setting('记账偏好','入账方式与币种','bill','recording')}${setting('屏幕识别','识别方式与提醒','scan','screen')}${setting('分类与账户','整理账本内容','wallet','catalog')}${setting('备份与恢复','保留一份账单副本','backup','backup')}${setting('外观','深色模式与语言','sun','theme')}${setting('识别规则','管理渠道识别规则','settings','rules')}${setting('关于 JustLedger','版本与开源致谢','info','about')}<p class="quiet">JustLedger · 本地记账，清楚生活</p>`}
function render(app){const {el,state:s}=app;el.classList.toggle('dark',s.dark);el.innerHTML=`<div class="statusbar"><span>9:41</span><span>${icon('signal')}${icon('battery')}</span></div><div class="viewport"><section class="page">${s.page==='overview'?overview(app):s.page==='bills'?bills(app):settings()}</section></div><nav class="nav" aria-label="主导航">${[['overview','home','概览'],['bills','bill','账单'],['settings','settings','设置']].map(([p,i,n])=>`<button data-page="${p}" ${s.page===p?'aria-current="page"':''}>${icon(i)}${n}</button>`).join('')}</nav>`;if(s.modal)paintModal(app)}
function newDraft(){return {id:0,merchant:'街角咖啡',item:'冰拿铁',category:'饮品',channel:'微信',amount:18,type:'支出',day:18,time:'09:42:50',account:'零钱'}}
function openModal(app,kind,bill){const s=app.state;if(['editor','candidate','delete'].includes(kind)){s.draft=structuredClone(bill||newDraft());s.returnModal=kind}s.modal=kind;paintModal(app)}
function switches(app,rows){return rows.map(([key,title,help])=>`<div class="switch-row"><span><strong>${title}</strong><small>${help}</small></span><button class="switch" role="switch" aria-label="${title}" aria-checked="${!!app.state.switches[key]}" data-switch="${key}"></button></div>`).join('')}
function paintModal(app){$('.overlay',app.el)?.remove();const s=app.state,kind=s.modal;if(!kind)return;const overlay=document.createElement('div');overlay.className='overlay';overlay.innerHTML=`<section class="sheet" role="dialog" aria-modal="true" aria-label="${kind==='receipt'?'已自动计入':'账单设置'}"></section>`;app.el.append(overlay);const sheet=$('.sheet',overlay);let body='',title='',header=true;
 if(kind==='editor'||kind==='candidate'){const b=s.draft;title=b.id?'编辑账单':'核对账单';body=`<div class="edit-amount"><input name="amount" type="number" min="0.01" step="0.01" value="${b.amount.toFixed(2)}" aria-label="金额"><select name="type" aria-label="收支类型"><option ${b.type==='支出'?'selected':''}>支出</option><option ${b.type==='收入'?'selected':''}>收入</option></select></div>${kind==='candidate'?`<div class="review">可能已有记录<small>同一笔？点选原记录补充</small></div><button class="candidate" data-action="confirm-merge">街角咖啡　¥18.00　›<small>10-18 09:42:18 · 微信</small></button>`:''}<div class="edit-row">${icon('bill')}<label for="merchant-${instances.indexOf(app)}">商户</label><input id="merchant-${instances.indexOf(app)}" name="merchant" value="${esc(b.merchant)}"></div><div class="edit-row">${icon('bag')}<label for="item-${instances.indexOf(app)}">商品</label><input id="item-${instances.indexOf(app)}" name="item" value="${esc(b.item)}"></div><button class="edit-row" data-action="categories">${icon(catIcons[b.category]||'other')}分类　${esc(b.category)}　›</button><div class="edit-row">${icon('time')}<input name="date" type="datetime-local" step="1" aria-label="交易时间" value="2026-10-${String(b.day).padStart(2,'0')}T${b.time}"></div><div class="edit-row">${icon('wallet')}<label>渠道</label><select name="channel" aria-label="支付渠道">${['微信','支付宝','银行卡','美团','其他'].map(c=>`<option ${b.channel===c?'selected':''}>${c}</option>`).join('')}</select></div><input class="remark" name="remark" aria-label="备注" placeholder="备注（选填）" value="${esc(b.remark||'')}"><details class="details"><summary>更多订单信息</summary><p>商品数量：1<br>订单状态：已完成<br>订单编号：DEMO-20261018-001</p></details><div class="buttons"><button class="secondary" data-action="close">取消</button><button class="primary" data-action="save-bill">${kind==='candidate'?'另存新账单':'保存'}</button></div>`}
 else if(kind==='delete'){title='删除确认';body=`<p class="hint">删除 ${esc(s.draft.merchant)} · ¥${money(s.draft.amount)} 这笔账单？</p><div class="buttons"><button class="secondary" data-action="close">取消</button><button class="primary" data-action="delete-confirm">确认删除</button></div>`}
 else if(kind==='categories'){title='选择分类';body=`<div class="categories">${categories.map(c=>`<button class="category" data-category="${c}" aria-pressed="${s.draft?.category===c}"><span class="tile">${icon(catIcons[c]||'other')}</span>${c}</button>`).join('')}</div><div class="buttons"><button class="primary" data-action="category-done">完成</button></div>`}
 else if(kind==='receipt'){header=false;const id=s.receipts[s.receiptIndex],b=s.bills.find(x=>x.id===id);if(!b){s.modal='';overlay.remove();toast(app,'全部提醒已确认');return}body=`<div class="sheet-head">已自动计入</div><div class="receipt"><span class="tile">${icon(catIcons[b.category]||'other')}</span><div class="paid">−${money(b.amount)}</div><div class="merchant">${esc(b.merchant)}</div><p>${esc(b.category)} · ${esc(b.channel)} · 09:42</p></div><div class="pager"><button data-action="prev-receipt" aria-label="上一笔" ${s.receiptIndex===0?'disabled':''}>‹</button><span>${s.receiptIndex+1} / ${s.receipts.length} 笔待确认</span><button data-action="next-receipt" aria-label="下一笔" ${s.receiptIndex===s.receipts.length-1?'disabled':''}>›</button></div><div class="buttons"><button class="secondary" data-action="edit-receipt">去修改</button><button class="primary" data-action="ack">知道了</button></div>`}
 else if(kind==='confirm-merge'){title='补充到这笔账单？';body='<p class="hint">街角咖啡 · ¥18.00<br>保留已确认金额，只补充缺失信息。</p><div class="buttons"><button class="secondary" data-action="back-candidate">取消</button><button class="primary" data-action="merge">确认补充</button></div>'}
 else if(kind==='ai'){title='AI 辅助识别';body=`${switches(app,[['ai','允许使用 AI','开启后允许调用你配置的模型服务'],['priority','优先使用 AI 识别','先判断交易详情；失败重试 2 次后使用本地规则']])}<label class="field">服务地址<input name="api-url" type="url" value="https://api.example.com/v1" autocomplete="off" aria-label="服务地址"></label><label class="field">API Key<input name="api-key" type="password" placeholder="演示页面，请勿填写真实密钥" autocomplete="off" aria-label="API Key"></label><label class="field">模型名称<input name="api-model" value="your-model" autocomplete="off" aria-label="模型名称"></label><p class="hint">这里只演示三项配置，不连接模型服务。<br>真实配置在手机 App 中填写。</p><div class="buttons"><button class="primary" data-action="demo-config">完成演示</button></div>`}
 else if(kind==='remember'){title='自动识别这类页面？';body='<p class="hint">记住后自动识别；永不则不再询问。<br>仍可随时手动识别。</p><div class="buttons"><button class="secondary" data-action="never">永不记住</button><button class="secondary" data-action="close">暂时不</button><button class="primary" data-action="remember">记住</button></div>'}
 else if(kind==='screen'){title='屏幕识别';body=switches(app,[['success','手动保存提示','开启后提示保存成功；不影响自动入账确认'],['backtap','轻敲背面识别','开启后可轻敲手机触发识别'],['screen','自动屏幕识别','已识别订单跳过，仍可手动识别']])+setting('页面识别偏好','已记住与永不记住的页面','scan','remembered')+setting('AI 辅助识别','配置后 AI 优先，失败时使用本地规则','settings','ai')}
 else if(kind==='recording'){title='记账偏好';body=switches(app,[['auto','自动入账','开启后直接入账并提醒；关闭后先核对'],['repeat','重复识别','开启后合并同一交易的多渠道记录']])+'<p class="hint">金额不单独判重，疑似记录需你确认。</p>'}
 else if(kind==='capture'){title='自动记账';body=['通知读取','短信接收','无障碍屏幕识别','悬浮窗提醒'].map((x,i)=>`<div class="switch-row"><span><strong>${x}</strong><small>${['读取完整付款通知并匹配渠道规则','接收新短信，需对应银行规则','用于读取当前页面及截图 OCR','入账后展示待确认提醒'][i]}</small></span><span style="color:var(--green);margin-left:auto;font-size:11px">已开启</span></div>`).join('')+'<p class="hint">演示状态。实际效果取决于手机权限、消息内容和规则适配。</p>'}
 else if(kind==='catalog'){title='分类与账户';body=setting('支出分类','22 个常用分类','bag','catalog-categories')+setting('账户','按实际付款账户整理','wallet','accounts')+setting('账本','默认本地账本','bill','books')}
 else {const map={backup:['备份与恢复','账单保存在手机应用私有目录。\n请在 App 内导出备份；卸载前先备份。'],rules:['识别规则','管理通知与短信渠道规则。\n通知缺少金额或规则不匹配时，不会猜测入账。'],remembered:['页面识别偏好','记住的是页面类型，用于自动触发 OCR。\n同一订单的重复识别由独立去重机制处理。'],accounts:['账户','示例账户：零钱、余额、生活卡。\n账户名称只是记账标签，不连接银行卡。'],books:['账本','当前为默认本地账本。'],about:['关于 JustLedger','基于 AutoAccounting 二次开发。\n遵循 GPL-3.0，保留上游版权。\n这是 HTML 演示，非实机截图。']};const info=map[kind]||['说明','当前页面使用演示数据。'];title=info[0];body=`<p class="hint" style="white-space:pre-line">${esc(info[1])}</p>`}
 sheet.innerHTML=(header?`<div class="sheet-head"><span>${title}</span><button class="icon-button" data-action="close" aria-label="关闭">${icon('close')}</button></div>`:'')+body;
}
function stash(app){const s=app.state,form=$('.sheet',app.el);if(!s.draft||!form||!$('input[name=amount]',form))return;const b=s.draft;for(const k of ['merchant','item','channel','remark','type']){const el=$(`[name=${k}]`,form);if(el)b[k]=el.value}b.amount=Number($('[name=amount]',form).value);const date=$('[name=date]',form).value;if(date){b.day=Number(date.slice(8,10));b.time=date.slice(11).padEnd(8,':00')}}
function toast(app,text){$('.toast',app.el)?.remove();const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=text;app.el.append(t);setTimeout(()=>t.remove(),2600)}
function bind(app){let hold,pressStart,held=false;const stop=()=>clearTimeout(hold);app.el.addEventListener('pointerdown',e=>{const row=e.target.closest('[data-bill]');held=false;if(!row||e.button!==0)return;pressStart=[e.clientX,e.clientY];hold=setTimeout(()=>{held=true;openModal(app,'delete',app.state.bills.find(x=>x.id===Number(row.dataset.bill)))},600)});app.el.addEventListener('pointermove',e=>{if(pressStart&&Math.hypot(e.clientX-pressStart[0],e.clientY-pressStart[1])>8)stop()});for(const ev of ['pointerup','pointercancel','pointerleave'])app.el.addEventListener(ev,stop);app.el.addEventListener('contextmenu',e=>{const row=e.target.closest('[data-bill]');if(row){e.preventDefault();stop();openModal(app,'delete',app.state.bills.find(x=>x.id===Number(row.dataset.bill)))}});app.el.addEventListener('input',e=>{if(e.target.matches('.search')){app.state.query=e.target.value;$('.transactions',app.el).innerHTML=billRows(app)}});let touchX=0;app.el.addEventListener('touchstart',e=>{touchX=e.touches[0].clientX},{passive:true});app.el.addEventListener('touchend',e=>{if(app.state.modal!=='receipt')return;const delta=e.changedTouches[0].clientX-touchX;if(Math.abs(delta)>55){app.state.receiptIndex=Math.max(0,Math.min(app.state.receipts.length-1,app.state.receiptIndex+(delta<0?1:-1)));paintModal(app)}},{passive:true});app.el.addEventListener('click',e=>{if(held){held=false;return}const b=e.target.closest('button');if(!b)return;const s=app.state;
 if(b.dataset.page){s.page=b.dataset.page;s.modal='';render(app);return}
 if(b.dataset.channel){s.channel=b.dataset.channel;render(app);return}
 if(b.dataset.bill){openModal(app,'editor',s.bills.find(x=>x.id===Number(b.dataset.bill)));return}
 if(b.dataset.switch){s.switches[b.dataset.switch]=!s.switches[b.dataset.switch];paintModal(app);return}
 if(b.dataset.category){s.draft.category=b.dataset.category;paintModal(app);return}
 const a=b.dataset.action;if(!a)return;
 if(a==='privacy'){s.hidden=!s.hidden;render(app)}
 else if(a==='bills'){s.page='bills';render(app)}
 else if(a==='theme'){s.dark=!s.dark;render(app)}
 else if(a==='close'){s.modal='';paintModal(app)}
 else if(a==='new')openModal(app,'editor');
 else if(a==='categories'){stash(app);s.modal='categories';paintModal(app)}
 else if(a==='catalog-categories'){s.draft=newDraft();s.returnModal='catalog';s.modal='categories';paintModal(app)}
 else if(a==='category-done'){s.modal=s.returnModal;paintModal(app)}
 else if(a==='delete-confirm'){s.bills=s.bills.filter(b=>b.id!==s.draft.id);s.receipts=s.receipts.filter(id=>id!==s.draft.id);s.modal='';render(app);toast(app,'已删除演示账单')}
 else if(a==='save-bill'){stash(app);if(!Number.isFinite(s.draft.amount)||s.draft.amount<=0){toast(app,'请输入有效金额');return}const old=s.bills.findIndex(x=>x.id===s.draft.id);if(old>=0)s.bills[old]=structuredClone(s.draft);else s.bills.push({...s.draft,id:Math.max(...s.bills.map(x=>x.id))+1});s.modal='';render(app);toast(app,'已更新演示账单')}
 else if(a==='confirm-merge'){stash(app);s.modal='confirm-merge';paintModal(app)}
 else if(a==='back-candidate'){s.modal='candidate';paintModal(app)}
 else if(a==='merge'){s.modal='';render(app);toast(app,'演示：补充原账单，未新增支出')}
 else if(a==='next-receipt'||a==='prev-receipt'){s.receiptIndex+=a==='next-receipt'?1:-1;paintModal(app)}
 else if(a==='ack'){s.receipts.splice(s.receiptIndex,1);s.receiptIndex=Math.min(s.receiptIndex,Math.max(0,s.receipts.length-1));paintModal(app)}
 else if(a==='edit-receipt')openModal(app,'editor',s.bills.find(x=>x.id===s.receipts[s.receiptIndex]));
 else if(a==='never'||a==='remember'){s.modal='';paintModal(app);toast(app,a==='never'?'演示：这类页面不再询问':'演示：已记住这类页面')}
 else if(a==='month')toast(app,'演示数据固定为 2026 年 10 月');
 else if(a==='demo-config'){s.modal='';paintModal(app);toast(app,'演示结束，未保存或发送任何配置')}
 else openModal(app,a);
 });app.el.addEventListener('keydown',e=>{if(e.key==='Escape'&&app.state.modal&&app.state.modal!=='receipt'){app.state.modal='';paintModal(app)}})}
const gallery=new URLSearchParams(location.search).get('gallery');
if(gallery){const titles=gallery==='recognition'?['信息不完整，也能补齐。','订单核对 · 入账确认 · AI 配置']:['每一笔，都清楚。','概览 · 渠道与分类 · 精简设置'];$('#stage').className='gallery-stage';$('#stage').innerHTML=`<header class="gallery-header"><div><div class="brand">JustLedger</div><h1>${titles[0]}</h1></div><p>${titles[1]}</p></header><div class="gallery-grid"></div><footer class="gallery-caption"><span>基于 AutoAccounting 二次开发 · Android</span><span>HTML 渲染 · 演示数据，非实机截图</span></footer>`;const host=$('.gallery-grid');if(gallery==='recognition'){makeDevice(host,'bills','candidate');makeDevice(host,'overview','receipt');makeDevice(host,'settings','ai')}else{makeDevice(host,'overview');makeDevice(host,'bills');makeDevice(host,'settings')}}
else{const app=makeDevice($('#mount'));$$('[data-demo]').forEach(b=>b.addEventListener('click',()=>{if(b.dataset.demo==='receipt'&&!app.state.receipts.length)app.state.receipts=[1,2];openModal(app,b.dataset.demo)}));$('#theme-toggle').addEventListener('click',()=>{app.state.dark=!app.state.dark;render(app)})}
window.JustLedgerPreview={instances,openModal,render};
</script>
</body></html>
